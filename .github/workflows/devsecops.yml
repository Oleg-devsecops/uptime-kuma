# =============================================================================
# DevSecOps Pipeline для Uptime Kuma (форк)
# -----------------------------------------------------------------------------
# Этапы:
#   1. build      — линт, сборка, unit-тесты
#   2. sast       — статический анализ (Semgrep)
#   3. secrets    — поиск утечек (Gitleaks)
#   4. sca        — анализ зависимостей (npm audit + Trivy fs)
#   5. container  — Hadolint + Trivy image
#
# Дополнительные этапы (deploy, dast, gateway) добавятся позже.
# Все security-jobs имеют continue-on-error: true, чтобы не блокировать сборку
# на этапе отладки пайплайна. Security Gateway (позже) будет применять пороги.
# =============================================================================

name: DevSecOps Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devsecops-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "26.2.0"

jobs:
  # ===========================================================================
  # 1. BUILD
  # ===========================================================================
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Lint JS
        run: npm run lint:js

      - name: Build
        run: npm run build

      - name: Backend tests (core, must pass)
        run: |
          npx cross-env TEST_BACKEND=1 node --import=tsx --test --test-reporter=spec \
            "test/backend-test/check-translations.test.js" \
            "test/backend-test/test-better-auth.ts" \
            "test/backend-test/test-cert-hostname-match.js" \
            "test/backend-test/test-domain.js" \
            "test/backend-test/test-monitor-response.js" \
            "test/backend-test/test-ping-chart.js" \
            "test/backend-test/test-status-page.js" \
            "test/backend-test/test-uptime-calculator.js" \
            "test/backend-test/test-util.js" \
            "test/backend-test/test-util-server.js"

      - name: Backend tests (full suite, informational)
        run: npm run test-backend
        continue-on-error: true

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  # ===========================================================================
  # 2. SAST (Semgrep)
  # ===========================================================================
  sast-semgrep:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep
        run: |
          semgrep scan \
            --config=p/javascript \
            --config=p/typescript \
            --config=p/vue \
            --config=p/nodejs \
            --config=p/owasp-top-ten \
            --config=p/secrets \
            --sarif \
            --output=semgrep.sarif \
            --metrics=off \
            || true
        continue-on-error: true

      - name: Upload SARIF artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-sarif
          path: semgrep.sarif
          retention-days: 14
          if-no-files-found: warn

      - name: Upload SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep
        continue-on-error: true

  # ===========================================================================
  # 3. SECRETS (Gitleaks)
  # ===========================================================================
  secrets-gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITLEAKS_ENABLE_COMMENTS: "false"
        continue-on-error: true

      - name: Upload Gitleaks report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: results.sarif
          retention-days: 14
          if-no-files-found: warn

  # ===========================================================================
  # 4. SCA (npm audit + Trivy fs)
  # ===========================================================================
  sca:
    name: SCA (npm audit + Trivy fs)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: npm audit (production deps)
        run: |
          npm ci --no-audit --no-fund --ignore-scripts
          npm audit --omit=dev --json > npm-audit.json || true
          echo "npm audit report saved"
        continue-on-error: true

      - name: Upload npm audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit.json
          retention-days: 14
          if-no-files-found: warn

      - name: Trivy fs scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs.sarif
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"
        continue-on-error: true

      - name: Upload Trivy SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-fs-sarif
          path: trivy-fs.sarif
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
        continue-on-error: true

  # ===========================================================================
  # 5. CONTAINER (Hadolint + Trivy image)
  # ===========================================================================
  container:
    name: Container (Hadolint + Trivy image)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: build
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Hadolint (Dockerfile linter)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: docker/dockerfile
          failure-threshold: warning
        continue-on-error: true

      - name: Build Docker image (local)
        run: |
          docker build \
            --target release \
            -f docker/dockerfile \
            -t uptime-kuma:devsecops-${{ github.sha }} \
            .
        continue-on-error: true

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: uptime-kuma:devsecops-${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
        continue-on-error: true

      - name: Upload Trivy image SARIF
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-image-sarif
          path: trivy-image.sarif
          retention-days: 14
          if-no-files-found: warn

      - name: Upload Trivy image SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
        continue-on-error: true
      - name: Upload Trivy image SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
        continue-on-error: true

  # ===========================================================================
  # 6. BUILD & PUSH в GHCR
  # ---------------------------------------------------------------------------
  # Запускается только на push в master.
  # Ждёт успешного завершения ВСЕХ security-jobs (это и есть базовый gateway).
  # Публикует образ в GitHub Container Registry с тегами:
  #   - latest
  #   - sha-XXXXXXX
  # ===========================================================================
  build-and-push:
    name: Build & Push image to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build, sast-semgrep, secrets-gitleaks, sca, container]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image to GHCR
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          # GHCR требует имя образа в нижнем регистре — приводим явно
          OWNER_LOWER=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/${OWNER_LOWER}/uptime-kuma
          SHA_SHORT=$(echo $GITHUB_SHA | cut -c1-7)

          echo "Building: $IMAGE:latest"
          echo "Building: $IMAGE:sha-$SHA_SHORT"

          docker build \
            --target release \
            -f docker/dockerfile \
            -t $IMAGE:latest \
            -t $IMAGE:sha-$SHA_SHORT \
            .

          docker push $IMAGE:latest
          docker push $IMAGE:sha-$SHA_SHORT

  # ===========================================================================
  # 7. DEPLOY — автоматический деплой на VPS
  # ---------------------------------------------------------------------------
  # Запускается только на push в master после успешного build-and-push.
  # Заходит по SSH под пользователем deploy и обновляет контейнер.
  # Использует секреты GitHub: VPS_HOST, VPS_USER, VPS_SSH_PRIVATE_KEY.
  # ===========================================================================
  deploy-staging:
    name: Deploy to Staging (VPS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, sast-semgrep, secrets-gitleaks, sca, container, build-and-push]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: staging
      url: http://89.23.97.174
    permissions:
      contents: read

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script_stop: true
          script: |
            cd /home/deploy/project
            echo "=== Pulling latest image ==="
            docker compose pull
            echo "=== Restarting container ==="
            docker compose up -d
            echo "=== Container status ==="
            docker compose ps
            echo "=== Waiting for healthy ==="
            for i in 1 2 3 4 5 6; do
              sleep 5
              if docker compose ps | grep -q "(healthy)"; then
                echo "Service is healthy"
                exit 0
              fi
            done
            echo "Service did not become healthy in 30s"
            docker compose logs --tail 30
            exit 1

  # ===========================================================================
  # 8. DAST — динамический анализ работающего сервиса (OWASP ZAP)
  # ---------------------------------------------------------------------------
  # Запускается после deploy-staging.
  # Сканирует публично доступный staging: http://89.23.97.174
  # ZAP baseline — «безопасный» режим: пассивное сканирование + активные
  # проверки без разрушительных payload'ов.
  # Отчёты (HTML, JSON, SARIF) сохраняются в артефактах.
  # ===========================================================================
  dast-zap:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [deploy-staging]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    permissions:
      contents: read
      security-events: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Wait for staging service
        run: |
          echo "Waiting for http://89.23.97.174 ..."
          for i in $(seq 1 30); do
            if curl -sSf -o /dev/null -m 5 http://89.23.97.174; then
              echo "Service is up (attempt $i)"
              exit 0
            fi
            echo "attempt $i: not ready, sleeping 5s"
            sleep 5
          done
          echo "Service did not become ready in 150s"
          exit 1

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://89.23.97.174'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -j'
          allow_issue_writing: true
          artifact_name: 'zap-baseline-report'
        continue-on-error: true

      - name: Upload ZAP reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-baseline-artifacts
          path: |
            report_html.html
            report_json.json
            report_md.md
          retention-days: 14
          if-no-files-found: warn

      - name: Upload ZAP SARIF to GitHub Security
        if: always() && hashFiles('report_json.json') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: report_json.json
          category: zap-baseline
        continue-on-error: true

  # ===========================================================================
  # 9. SECURITY GATEWAY — финальная проверка порогов
  # ---------------------------------------------------------------------------
  # Парсит SARIF-отчёты всех сканеров, считает Critical/High/Medium/Low.
  # Применяет пороги:
  #   Critical >= 1 → блокирует
  #   High >= 1 → блокирует
  #   Medium >= 1 → warn (не блокирует)
  # Публикует summary в GitHub Step Summary.
  # ===========================================================================
  security-gateway:
    name: Security Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build, sast-semgrep, secrets-gitleaks, sca, container, build-and-push, dast-zap]
    if: always() && (github.ref == 'refs/heads/master' || github.event_name == 'pull_request')
    permissions:
      contents: read
      security-events: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download all security artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare reports directory
        run: |
          mkdir -p reports
          find artifacts -type f \( -name '*.sarif' -o -name 'report_json.json' \) -exec cp {} reports/ \;
          ls -la reports/

      - name: Run Security Gateway
        id: gateway
        run: |
          chmod +x scripts/security-gateway.sh
          bash scripts/security-gateway.sh reports

      - name: Comment on PR (if pull_request)
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          GATEWAY_STATUS: ${{ steps.gateway.outcome }}
        with:
          script: |
            const status = process.env.GATEWAY_STATUS;
            const icon = status === 'success' ? '✅' : '❌';
            const text = status === 'success'
              ? 'Security Gateway: **пороги пройдены**. Релиз разрешён.'
              : 'Security Gateway: **релиз заблокирован**. Обнаружены Critical/High уязвимости.';
            const body = [
              `## ${icon} Security Gateway`,
              '',
              text,
              '',
              '### Рекомендации',
              '- **Critical/High:** исправить до merge',
              '- **Medium:** рассмотреть в следующем релизе',
              '- **Low/Info:** информационно, действий не требуется',
              '',
              '_Отчёт доступен в разделе Actions → этот workflow → артефакты._'
            ].join('\n');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body
            });
